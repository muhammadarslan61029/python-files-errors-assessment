<text x="52" y="55" font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="700" >Task 1 · Attendance list cleaner</text>
<text x="850" y="55" font-size="15" fill="#BFDBFE" text-anchor="end" font-weight="400" font-family="Consolas, Menlo, 'Courier New', monospace" >attendance_cleaner.py</text>
