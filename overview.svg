<text x="98" y="119.0" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="700" >Topic</text>
<text x="162" y="118.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >File handling and error handling: read a text file, clean the data, save a CSV.</text>
