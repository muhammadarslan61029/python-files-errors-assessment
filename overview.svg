<text x="98" y="183.0" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="700" >Input</text>
<text x="162" y="173.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >attendance.txt - one student name per line (messy spacing, mixed case,</text>
<text x="162" y="191.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >duplicates and blank lines allowed).</text>
<rect x="50" y="220" width="96" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="98" y="255.0" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="700" >Rules</text>
<text x="162" y="245.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >Trim and collapse spaces · Title Case · skip blank lines · remove duplicates</text>
<text x="162" y="263.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >· sort A-Z · fail with a clear message if the file cannot be read or written.</text>
