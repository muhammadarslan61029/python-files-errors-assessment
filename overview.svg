<text x="162" y="317.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >Console report (record count, unique count, numbered list) and</text>
<text x="162" y="335.725" font-size="13.5" fill="#0F172A" text-anchor="start" font-weight="400" >attendance_clean.csv with a student_name header.</text>
