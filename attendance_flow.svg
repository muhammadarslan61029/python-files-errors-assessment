<svg xmlns="http://www.w3.org/2000/svg" width="790" height="970" viewBox="0 0 790 970" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect width="790" height="970" fill="#FFFFFF"/>
<rect x="200" y="20" width="140" height="40" rx="20" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
