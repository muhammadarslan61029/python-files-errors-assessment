<text x="640" y="226.375" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="400" >no permission / not UTF-8</text>
<text x="640" y="243.375" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="400" >End (exit 1)</text>
