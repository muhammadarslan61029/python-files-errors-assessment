<text x="288" y="296" font-size="13" fill="#16A34A" text-anchor="start" font-weight="700" >Yes</text>
<rect x="110" y="312" width="320" height="78" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="270" y="337.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >clean_names(): for each line</text>
<text x="270" y="355.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >strip + collapse spaces, .title(),</text>
<text x="270" y="373.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >skip blank lines</text>
<path d="M110,336 H80 V366 H107" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<text x="74" y="352" font-size="12" fill="#475569" text-anchor="end" font-weight="600" >loop</text>
<path d="M270,390 V434" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<polygon points="270,434 390,480 270,526 150,480" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
