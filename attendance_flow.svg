<text x="430" y="708" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="700" >No</text>
<rect x="530" y="680" width="220" height="72" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="640" y="703.375" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="400" >Error: could not write</text>
<text x="640" y="720.375" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="400" >attendance_clean.csv</text>
<text x="640" y="737.375" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="400" >End (exit 1)</text>
<path d="M270,762 V806" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<text x="288" y="790" font-size="13" fill="#16A34A" text-anchor="start" font-weight="700" >Yes</text>
<polygon points="138,806 420,806 402,876 120,876" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="270" y="827.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >print_report(): record count,</text>
<text x="270" y="845.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >unique count, numbered list,</text>
<text x="270" y="863.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >save message</text>
<path d="M270,876 V910" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<rect x="200" y="910" width="140" height="40" rx="20" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="270" y="935" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600" >End (exit 0)</text>
<text x="470" y="790" font-size="13" fill="#0F172A" text-anchor="start" font-weight="700" >Legend</text>
<rect x="470" y="800" width="18" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="498" y="812" font-size="12.5" fill="#0F172A" text-anchor="start" font-weight="400" >Input</text>
<rect x="470" y="824" width="18" height="14" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="498" y="836" font-size="12.5" fill="#0F172A" text-anchor="start" font-weight="400" >Decision</text>
<rect x="470" y="848" width="18" height="14" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="498" y="860" font-size="12.5" fill="#0F172A" text-anchor="start" font-weight="400" >Success output</text>
<rect x="470" y="872" width="18" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="498" y="884" font-size="12.5" fill="#0F172A" text-anchor="start" font-weight="400" >Error / rejection</text>
