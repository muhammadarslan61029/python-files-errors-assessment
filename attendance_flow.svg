<text x="270" y="593.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >unique_sorted(): set() removes</text>
<text x="270" y="611.55" font-size="13" fill="#0F172A" text-anchor="middle" font-weight="400" >duplicates, sorted() orders A-Z</text>
