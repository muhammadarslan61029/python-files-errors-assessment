<path d="M390,480 H530" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
<text x="430" y="472" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="700" >No</text>
<rect x="530" y="444" width="220" height="72" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
